
services:
  nginx:
    build: ./nginx
    ports:
      - 1337:80
    depends_on:
    - web
  web:
    build: ./backend
    command: gunicorn backend.wsgi:application --bind 0.0.0.0:1375
    volumes:
      - ./backend/:/usr/src/LST2/backend/
    expose:
      - 1375
    env_file:
      - ./.env.dev
    depends_on:
      - db
      - daphne
  daphne:
    build: ./backend
    command: daphne --bind 0.0.0.0 -p 8002 backend.asgi:application
    ports:
      -8002:8002
  db:
    image: postgres:17
    volumes:
      - postgres_data:/Library/PostgreSQL/17/data/
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Password1
      - POSTGRES_DB=LSTDB
  
volumes:
  postgres_data:
